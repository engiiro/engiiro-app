name: "✨ 機能詳細"
description: "新機能や仕様変更を提案・定義する（実装に着手する前に、仕様をここで固める）"
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        新機能・仕様変更の提案です。**実装を始める前に、この内容でチーム（人間）の合意を取ってからIssueをOpenにしてください。**
        既存の docs/design_doc.md の内容と矛盾する場合は、まず設計書側の更新を相談してください（「🙋 その他・相談」）。

  - type: dropdown
    id: area
    attributes:
      label: 対応エリア
      options:
        - backend (Deno/TypeScript)
        - ai (Python)
        - frontend
        - infra/docker
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 機能概要
      description: 何をする機能か、1〜3行で
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 背景・目的
      description: なぜ必要か。誰の（赤ちゃんペルソナ/お母さんペルソナ利用者の）どんな課題を解決するか
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: 詳細仕様
      description: |
        入力/出力、API（エンドポイント・リクエスト/レスポンスJSON）、画面、データ設計への影響など、実装者がそのまま着手できる粒度で記述してください。
        既存のAPI設計・データ設計（docs/design_doc.md 6〜7章）と整合させること。
      placeholder: |
        - エンドポイント: POST /api/xxx
        - Request: { ... }
        - Response: { ... }
        - データ設計への影響: ["xxx", ...] エンティティに ○○ フィールドを追加
    validations:
      required: true

  - type: input
    id: design_doc_ref
    attributes:
      label: 関連する設計書の章番号
      description: 例）3.4-2（タイムライン表示・似た境遇レコメンド）
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 完了条件（Definition of Done）
      description: このIssueが「完了」と言える条件をチェックリスト形式で
      placeholder: |
        - [ ] エンドポイントが仕様通りのレスポンスを返す
        - [ ] 異常系（不正な入力等）のハンドリングがある
        - [ ] 関連するテスト/動作確認手順がある
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - Must（MVP必須機能）
        - Should（MVPだが後回し可）
        - Could（拡張機能）
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 同じ内容の既存Issueがないか検索した
          required: true
