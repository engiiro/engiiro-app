name: "バグ報告"
description: "動作しない・想定と違う挙動を報告する"
title: "[バグ] "
body:
  - type: textarea
    id: actual
    attributes:
      label: "起きたこと"
      description: "具体的な症状を書いてください。原因が不明でも報告できます。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期待する動作"
      description: "本来どうなってほしいかを書いてください。"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "再現手順・環境"
      description: "分かる範囲で手順、OS、ブラウザー、ブランチ等を記載。分からない点は未確認で構いません。"
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: "補足・ログ・画像"
      description: "必要な部分のみ記載し、API キーや個人情報を含めないでください。"
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: "関連日報・Issue"
      description: "関連する日報などの番号を記載してください。"
    validations:
      required: false
  - type: input
    id: pr
    attributes:
      label: "対応 PR"
      description: "修正する場合は、このバグを直接1件の PR に対応させます。同じ修正のタスクは作成不要です。"
    validations:
      required: false
